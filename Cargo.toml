[package]
name = "tort"
version = "0.1.0"
edition = "2021"
description = "Tor Tunnel - route applications through Tor inside an isolated network namespace"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["sched", "process", "user", "signal", "mount", "fs", "socket", "uio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
# Single-threaded runtime on purpose: see verify.rs. A multi-threaded runtime
# would spawn workers whose network namespace we do not control.
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# GUI only.
gtk4 = { version = "0.9", optional = true }
async-channel = { version = "2", optional = true }

[lib]
name = "tort"
path = "src/lib.rs"

[[bin]]
name = "tort"
path = "src/main.rs"

# The GUI is optional: a headless machine running only the daemon should not
# need GTK to build it.
[[bin]]
name = "tortunnel"
path = "src/bin/tortunnel.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:gtk4", "dep:async-channel"]
