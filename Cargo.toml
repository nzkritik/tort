[package]
name = "tort"
version = "0.1.0"
edition = "2021"
description = "Tor Tunnel - route applications through Tor inside an isolated network namespace"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["sched", "process", "user", "signal", "mount"] }
serde_json = "1.0"
# Single-threaded runtime on purpose: see verify.rs. A multi-threaded runtime
# would spawn workers whose network namespace we do not control.
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "tort"
path = "src/main.rs"
